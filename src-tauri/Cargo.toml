[package]
name = "LynShred"
version = "2.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["dialog-ask", "dialog-confirm", "dialog-message", "dialog-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shred-core = { path = "../crates/shred-core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
]
